<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demandas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506;--surface:#0c0d10;--surface2:#14161b;--line:#20232a;
  --text:#eceef2;--muted:#8b919d;
  --blue:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;
  --r:12px;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}

/* Início */
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:40px}
.home h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;text-align:center}
.home p.sub{color:var(--muted);text-align:center;margin-top:8px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:640px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 24px;text-align:left;transition:border-color .15s,background .15s,transform .15s}
.role:hover{background:var(--surface2);transform:translateY(-2px)}
.role[data-role=designer]:hover{border-color:var(--blue)}
.role[data-role=patrao]:hover{border-color:var(--green)}
.role i{display:block;width:10px;height:10px;border-radius:50%;margin-bottom:18px}
.role[data-role=designer] i{background:var(--blue)}
.role[data-role=patrao] i{background:var(--green)}
.role strong{display:block;font-size:22px;font-weight:700}
.role span{display:block;color:var(--muted);margin-top:6px;font-size:14px}

/* Topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,32px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,5,6,.92);backdrop-filter:blur(8px);z-index:5}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.pill{font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.designer{background:rgba(59,130,246,.15);color:var(--blue)}
.pill.patrao{background:rgba(34,197,94,.15);color:var(--green)}
.who .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Botões */
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:#3a3f4a}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#2f73e6}
.btn.green{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.45);color:var(--green)}
.btn.green:hover{background:var(--green);color:#04120a}
.btn.yellow{background:rgba(234,179,8,.12);border-color:rgba(234,179,8,.45);color:var(--yellow)}
.btn.yellow:hover{background:var(--yellow);color:#171100}
.btn.red{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:var(--red)}
.btn.red:hover{background:var(--red);color:#fff}

.wrap{max-width:920px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 80px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--text);border-color:var(--blue)}

/* Resumo */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;transition:border-color .15s}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat[data-f=todos] b{color:var(--text)}
.stat[data-f=pedido] b{color:var(--blue)}
.stat[data-f=produzindo] b{color:var(--yellow)}
.stat[data-f=concluido] b{color:var(--green)}
.stat[data-f=atrasadas] b{color:var(--red)}
.stat[aria-pressed=true][data-f=todos]{border-color:#555b66}
.stat[aria-pressed=true][data-f=pedido]{border-color:var(--blue)}
.stat[aria-pressed=true][data-f=produzindo]{border-color:var(--yellow)}
.stat[aria-pressed=true][data-f=concluido]{border-color:var(--green)}
.stat[aria-pressed=true][data-f=atrasadas]{border-color:var(--red)}

/* Form */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.form{display:grid;gap:14px;margin-bottom:24px}
.section-title,.form h2{font-size:17px;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);width:100%;color-scheme:dark}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}

/* Filtros */
.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}
.tools select{width:auto}
.list-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.list-title small{color:var(--muted)}

/* Lista */
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.item.done{opacity:.65}
.item-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.item h3{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.item p{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:600}
.tag.late{border-color:rgba(239,68,68,.5);color:var(--red);background:rgba(239,68,68,.08)}
.prio{border-radius:6px;padding:2px 8px;font-weight:700;font-size:12.5px;white-space:nowrap}
.prio.p0{background:var(--red);color:#fff}
.prio.p1{border:1px solid var(--red);color:var(--red)}
.prio.p2{border:1px solid #3a3f4a;color:var(--text)}
.prio.p3{border:1px solid var(--line);color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.pedido{color:var(--blue)}.st.produzindo{color:var(--yellow)}.st.concluido{color:var(--green)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line)}
.controls .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls select{width:auto;padding:6px 10px;font-size:13px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true][data-s=pedido]{background:var(--blue);color:#fff}
.seg button[aria-pressed=true][data-s=produzindo]{background:var(--yellow);color:#171100}
.seg button[aria-pressed=true][data-s=concluido]{background:var(--green);color:#04120a}
.delivery{display:grid;gap:6px}
.delivery a{color:var(--green);font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.delivery input{padding:7px 10px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r)}

/* Log */
.log-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.log-head .grp{display:flex;gap:8px;flex-wrap:wrap}
.log{padding:0}
.log li{list-style:none;display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border:0}
.log time{color:var(--muted);font-size:12.5px;white-space:nowrap;padding-top:2px}
.log b{font-weight:700}
.role-d{color:var(--blue)}.role-p{color:var(--green)}

/* Modal e aviso */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{width:100%;max-width:380px;display:grid;gap:14px}
.modal h2{font-size:20px;font-weight:700}
.modal .actions{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;z-index:30;max-width:90vw}
.toast.ok{border-color:var(--green)}.toast.err{border-color:var(--red)}

@media(max-width:620px){
  .roles,.row{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat[data-f=todos]{grid-column:1/-1}
  .item-head{flex-direction:column}
  .tools{grid-template-columns:1fr}.tools select{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="home" class="home">
  <div>
    <h1>Quem está acessando?</h1>
    <p class="sub">Escolha seu perfil para continuar.</p>
  </div>
  <div class="roles">
    <button class="role" data-role="designer"><i></i><strong>Designer</strong><span>Veja a fila e atualize o andamento.</span></button>
    <button class="role" data-role="patrao"><i></i><strong>Patrão</strong><span>Peça uma nova demanda.</span></button>
  </div>
</section>

<section id="app" class="hidden">
  <header class="top">
    <div class="who"><span class="pill" id="rolePill"></span><span class="name" id="userName"></span></div>
    <button class="btn sm" id="switch">Trocar perfil</button>
  </header>
  <main class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="demandas" aria-selected="true">Demandas</button>
      <button class="tab" role="tab" data-tab="log" aria-selected="false">Log</button>
    </div>

    <div id="tab-demandas">
      <form id="form" class="card form hidden">
        <h2>Nova demanda</h2>
        <label>Título
          <input name="title" required maxlength="80" placeholder="Ex.: Logo da loja de carros">
        </label>
        <label>Descrição
          <textarea name="desc" placeholder="O que precisa ser feito, cores, estilo, o que for útil"></textarea>
        </label>
        <div class="row">
          <label>Categoria
            <select name="cat"><option>Design gráfico</option><option>Design de interface</option></select>
          </label>
          <label>Prioridade
            <select name="prio">
              <option value="0">Urgente</option><option value="1">Alta</option>
              <option value="2" selected>Normal</option><option value="3">Baixa</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Prazo (opcional)<input type="date" name="due"></label>
          <label>Link de referência (opcional)<input type="url" name="ref" placeholder="https://"></label>
        </div>
        <div><button class="btn green" type="submit">Enviar demanda</button></div>
      </form>

      <div class="stats" id="stats"></div>
      <div class="tools">
        <input type="search" id="q" placeholder="Buscar por título ou descrição" aria-label="Buscar">
        <select id="catFilter" aria-label="Categoria">
          <option value="">Todas as categorias</option>
          <option>Design gráfico</option><option>Design de interface</option>
        </select>
      </div>
      <div class="list-title"><h2 class="section-title">Fila por prioridade</h2><small id="count"></small></div>
      <div class="list" id="list"></div>
    </div>

    <div id="tab-log" class="hidden">
      <div class="log-head">
        <h2 class="section-title">Histórico</h2>
        <div class="grp">
          <button class="btn sm" id="export">Exportar backup</button>
          <button class="btn sm" id="import">Importar backup</button>
          <input type="file" id="file" accept="application/json" class="hidden">
        </div>
      </div>
      <div class="card"><ul class="log" id="log"></ul></div>
    </div>
  </main>
</section>

<div id="nameModal" class="modal hidden">
  <form class="card" id="nameForm">
    <h2>Qual é o seu nome?</h2>
    <input id="nameInput" required maxlength="40" placeholder="Seu nome" autocomplete="name">
    <div class="actions">
      <button type="button" class="btn" id="nameCancel">Voltar</button>
      <button type="submit" class="btn primary">Entrar</button>
    </div>
  </form>
</div>

<script>
(function(){
  var KEY='demandas.v1',SKEY='demandas.sessao',NKEY='demandas.nome';
  var PRIO=['Urgente','Alta','Normal','Baixa'];
  var STATUS=[['pedido','Pedido feito'],['produzindo','Produzindo'],['concluido','Concluído']];
  var data={demands:[],log:[]},session=null,filter='todos',pendingRole=null,toastT;

  function $(s){return document.querySelector(s)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(t){return new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
  function fmtDue(s){var p=s.split('-');return p[2]+'/'+p[1]}
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function roleLabel(r){return r==='designer'?'Designer':'Patrão'}
  function stLabel(k){return STATUS.filter(function(s){return s[0]===k})[0][1]}
  function safeUrl(u){return /^https?:\/\//i.test(u)?u:''}
  function find(id){return data.demands.filter(function(x){return x.id===id})[0]}
  function late(d){return !!d.due&&d.status!=='concluido'&&d.due<today()}
  function toast(msg,type){
    var t=$('#toast');if(t)t.remove();
    t=document.createElement('div');t.id='toast';t.className='toast '+(type||'ok');t.textContent=msg;
    document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},2600);
  }
  function load(){
    try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.demands)data={demands:d.demands,log:d.log||[]}}catch(e){}
    try{session=JSON.parse(sessionStorage.getItem(SKEY))}catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function addLog(text){
    data.log.unshift({t:Date.now(),who:session.name,role:session.role,text:text});
    data.log=data.log.slice(0,300);
  }

  /* Entrada */
  document.querySelectorAll('.role').forEach(function(b){
    b.addEventListener('click',function(){
      pendingRole=b.dataset.role;
      $('#nameModal').classList.remove('hidden');
      var i=$('#nameInput');try{i.value=localStorage.getItem(NKEY)||''}catch(e){}
      i.focus();
    });
  });
  $('#nameCancel').addEventListener('click',function(){$('#nameModal').classList.add('hidden')});
  $('#nameForm').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('#nameInput').value.trim();if(!name)return;
    try{localStorage.setItem(NKEY,name)}catch(x){}
    session={role:pendingRole,name:name};
    try{sessionStorage.setItem(SKEY,JSON.stringify(session))}catch(x){}
    $('#nameModal').classList.add('hidden');
    addLog('entrou como '+roleLabel(session.role));save();show();
  });
  $('#switch').addEventListener('click',function(){
    sessionStorage.removeItem(SKEY);session=null;filter='todos';show();
  });

  /* Abas */
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===t)});
      $('#tab-demandas').classList.toggle('hidden',t.dataset.tab!=='demandas');
      $('#tab-log').classList.toggle('hidden',t.dataset.tab!=='log');
      renderLog();
    });
  });

  /* Nova demanda */
  $('#form').addEventListener('submit',function(e){
    e.preventDefault();var f=e.target;
    var d={id:Date.now().toString(36),title:f.title.value.trim(),desc:f.desc.value.trim(),cat:f.cat.value,
      prio:+f.prio.value,due:f.due.value,ref:safeUrl(f.ref.value.trim()),link:'',status:'pedido',by:session.name,created:Date.now()};
    if(!d.title)return;
    data.demands.push(d);
    addLog('pediu “'+d.title+'” ('+d.cat+', prioridade '+PRIO[d.prio].toLowerCase()+')');
    save();f.reset();f.prio.value='2';render();toast('Demanda enviada');
  });

  /* Filtros */
  $('#q').addEventListener('input',renderList);
  $('#catFilter').addEventListener('change',renderList);
  $('#stats').addEventListener('click',function(e){
    var b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;render();
  });

  function sorted(){
    return data.demands.slice().sort(function(a,b){
      var da=a.status==='concluido'?1:0,db=b.status==='concluido'?1:0;
      if(da!==db)return da-db;
      if(a.prio!==b.prio)return a.prio-b.prio;
      var x=a.due||'9999',y=b.due||'9999';if(x!==y)return x<y?-1:1;
      return a.created-b.created;
    });
  }
  function renderStats(){
    var c={todos:data.demands.length,pedido:0,produzindo:0,concluido:0,atrasadas:0};
    data.demands.forEach(function(d){c[d.status]++;if(late(d))c.atrasadas++});
    var items=[['todos','Todas'],['pedido','Pedido feito'],['produzindo','Produzindo'],['concluido','Concluídas'],['atrasadas','Atrasadas']];
    $('#stats').innerHTML=items.map(function(i){
      return '<button class="stat" data-f="'+i[0]+'" aria-pressed="'+(filter===i[0])+'"><b>'+c[i[0]]+'</b><span>'+i[1]+'</span></button>';
    }).join('');
  }
  function renderList(){
    var isD=session.role==='designer';
    var q=$('#q').value.trim().toLowerCase(),cat=$('#catFilter').value;
    var items=sorted().filter(function(d){
      if(filter==='atrasadas'){if(!late(d))return false}
      else if(filter!=='todos'&&d.status!==filter)return false;
      if(cat&&d.cat!==cat)return false;
      if(q&&(d.title+' '+d.desc).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
    $('#count').textContent=items.length+(items.length===1?' demanda':' demandas');
    if(!items.length){
      $('#list').innerHTML='<div class="empty">'+(data.demands.length?'Nada encontrado com esses filtros.':(isD?'Nenhuma demanda por aqui ainda.':'Nenhuma demanda enviada. Use o formulário acima para pedir a primeira.'))+'</div>';
      return;
    }
    $('#list').innerHTML=items.map(function(d){
      var ctrl,deliv='';
      if(isD){
        deliv='<div class="delivery"><input data-link="'+d.id+'" value="'+esc(d.link||'')+'" placeholder="Link da entrega (opcional)" aria-label="Link da entrega"></div>';
        ctrl='<div class="controls"><div class="seg" role="group" aria-label="Status">'+
          STATUS.map(function(s){return '<button data-act="st" data-id="'+d.id+'" data-s="'+s[0]+'" aria-pressed="'+(d.status===s[0])+'">'+s[1]+'</button>'}).join('')+
          '</div><div class="grp"><select data-prio="'+d.id+'" aria-label="Prioridade">'+
          PRIO.map(function(p,i){return '<option value="'+i+'"'+(d.prio===i?' selected':'')+'>'+p+'</option>'}).join('')+
          '</select><button class="btn red sm" data-act="del" data-id="'+d.id+'">Remover</button></div></div>';
      }else{
        if(d.link&&safeUrl(d.link))deliv='<div class="delivery"><a href="'+esc(d.link)+'" target="_blank" rel="noopener">Ver entrega</a></div>';
        var btn='';
        if(d.status==='concluido')btn='<button class="btn yellow sm" data-act="adj" data-id="'+d.id+'">Pedir ajuste</button>';
        else if(d.status==='pedido'&&d.by===session.name)btn='<button class="btn red sm" data-act="cancel" data-id="'+d.id+'">Cancelar</button>';
        ctrl='<div class="controls"><span class="st '+d.status+'">'+stLabel(d.status)+'</span>'+btn+'</div>';
      }
      return '<article class="item'+(d.status==='concluido'?' done':'')+'">'+
        '<div class="item-head"><h3>'+esc(d.title)+'</h3><span class="prio p'+d.prio+'">'+PRIO[d.prio]+'</span></div>'+
        (d.desc?'<p>'+esc(d.desc)+'</p>':'')+
        '<div class="meta"><span class="tag">'+esc(d.cat)+'</span>'+
        (d.due?'<span class="tag'+(late(d)?' late':'')+'">'+(late(d)?'Atrasada · ':'Prazo ')+fmtDue(d.due)+'</span>':'')+
        (d.ref?'<a href="'+esc(d.ref)+'" target="_blank" rel="noopener" style="color:var(--blue)">Referência</a>':'')+
        '<span>Pedido por '+esc(d.by)+' em '+fmt(d.created)+'</span></div>'+deliv+ctrl+'</article>';
    }).join('');
  }
  function renderLog(){
    $('#log').innerHTML=data.log.length?data.log.map(function(l){
      return '<li><time>'+fmt(l.t)+'</time><span><b>'+esc(l.who)+'</b> <span class="'+(l.role==='designer'?'role-d':'role-p')+'">('+roleLabel(l.role)+')</span> '+esc(l.text)+'</span></li>';
    }).join(''):'<li><span style="color:var(--muted)">O log ainda está vazio.</span></li>';
  }
  function render(){renderStats();renderList();renderLog()}

  /* Ações da lista */
  $('#list').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var d=find(b.dataset.id);if(!d)return;
    var a=b.dataset.act;
    if(a==='st'){
      if(d.status===b.dataset.s)return;
      var from=stLabel(d.status);d.status=b.dataset.s;
      addLog('moveu “'+d.title+'” de '+from+' para '+stLabel(d.status));
      save();render();toast('Status: '+stLabel(d.status));
    }else if(a==='del'||a==='cancel'){
      if(!confirm((a==='del'?'Remover':'Cancelar')+' “'+d.title+'”?'))return;
      data.demands=data.demands.filter(function(x){return x!==d});
      addLog((a==='del'?'removeu':'cancelou')+' “'+d.title+'”');save();render();
    }else if(a==='adj'){
      d.status='produzindo';addLog('pediu ajuste em “'+d.title+'”');save();render();toast('Ajuste solicitado','err');
    }
  });
  $('#list').addEventListener('change',function(e){
    var t=e.target,d;
    if(t.dataset.prio){
      d=find(t.dataset.prio);if(!d)return;
      var from=PRIO[d.prio];d.prio=+t.value;
      addLog('mudou a prioridade de “'+d.title+'” de '+from.toLowerCase()+' para '+PRIO[d.prio].toLowerCase());
      save();render();
    }else if(t.dataset.link!==undefined){
      d=find(t.dataset.link);if(!d)return;
      var v=t.value.trim();
      if(v&&!safeUrl(v)){toast('O link precisa começar com http:// ou https://','err');t.value=d.link||'';return}
      d.link=v;addLog((v?'adicionou o link de entrega em “':'removeu o link de entrega de “')+d.title+'”');
      save();render();toast('Link salvo');
    }
  });

  /* Backup */
  $('#export').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='demandas-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
  });
  $('#import').addEventListener('click',function(){$('#file').click()});
  $('#file').addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);if(!d||!Array.isArray(d.demands))throw 0;
        if(!confirm('Substituir os dados atuais pelo backup?'))return;
        data={demands:d.demands,log:Array.isArray(d.log)?d.log:[]};
        addLog('importou um backup');save();render();toast('Backup importado');
      }catch(x){toast('Arquivo inválido','err')}
    };
    r.readAsText(f);e.target.value='';
  });

  function show(){
    var inApp=!!session;
    $('#home').classList.toggle('hidden',inApp);
    $('#app').classList.toggle('hidden',!inApp);
    if(!inApp)return;
    var p=$('#rolePill');p.textContent=roleLabel(session.role);p.className='pill '+session.role;
    $('#userName').textContent=session.name;
    $('#form').classList.toggle('hidden',session.role!=='patrao');
    render();
  }
  load();show();
})();
</script>
</body>
</html>
